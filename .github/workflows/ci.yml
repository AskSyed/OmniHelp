name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unit tests mock the LLM; real keys never go into CI test runs
      OPENAI_API_KEY: sk-ci-dummy
      MCP_SERVER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -r requirements-chroma.txt
          pip install ruff==0.8.4 pip-audit==2.7.3

      - name: Lint (syntax errors and undefined names)
        run: ruff check app --select E9,F63,F7,F82

      - name: Unit tests
        run: python -m pytest -m "not integration" --ignore=../tests/exercises -q

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t omnihelp-backend:${{ github.sha }} backend

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omnihelp-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
