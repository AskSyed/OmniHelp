# Local stack: API + MCP server + Redis + Jaeger
#   docker compose up --build
#   API docs:  http://localhost:8000/docs
#   Traces:    http://localhost:16686  (service "omnihelp-backend")
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Secrets come from the developer's local .env; in real environments, from a secret store
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_SERVER_HOST: mcp
      MCP_SERVER_PORT: "8001"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mcp:
        condition: service_started

  mcp:
    build: ./order_management_mcp
    volumes:
      - mcp-data:/app/data

  redis:
    image: redis:7.4-alpine
    # Bounded memory with LRU eviction, as a cache should be
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

volumes:
  backend-data:
  mcp-data:
